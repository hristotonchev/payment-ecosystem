services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payments
      MYSQL_USER: payments
      MYSQL_PASSWORD: payments
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  payment-gateway:
    build:
      context: ./payment-gateway
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./payment-gateway/.env
    environment:
      DATABASE_URL: "mysql://payments:payments@mysql:3306/payments?serverVersion=8.0&charset=utf8mb4"
      RABBITMQ_DSN: "amqp://guest:guest@rabbitmq:5672/%2f"
      ADMIN_EMAIL: "admin@example.com"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  fraud-engine:
    build:
      context: ./fraud-engine
      dockerfile: Dockerfile
    env_file:
      - ./fraud-engine/.env
    environment:
      RABBITMQ_DSN: "amqp://guest:guest@rabbitmq:5672/%2f"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    env_file:
      - ./notification-service/.env
    environment:
      RABBITMQ_DSN: "amqp://guest:guest@rabbitmq:5672/%2f"
      MAILER_DSN: "smtp://mailpit:1025"
      MAILER_FROM: "noreply@payment-ecosystem.dev"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  rabbitmq_data:
